<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="exec-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40121a"/>
      <stop offset="60%" stop-color="#7a2432"/>
      <stop offset="100%" stop-color="#24070c"/>
    </linearGradient>
    <radialGradient id="exec-sun" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fca311" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e63946" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#40121a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#exec-bg)"/>
  <circle cx="280" cy="160" r="140" fill="url(#exec-sun)"/>

  <!-- Ascending Stairs / Geometric Flight -->
  <g fill="#1a0508" stroke="#ff758f" stroke-width="0.5">
    <polygon points="0,500 0,440 60,440 60,500"/>
    <polygon points="60,500 60,390 120,390 120,500"/>
    <polygon points="120,500 120,340 180,340 180,500"/>
    <polygon points="180,500 180,290 240,290 240,500"/>
    <polygon points="240,500 240,240 300,240 300,500"/>
    <polygon points="300,500 300,190 360,190 360,500"/>
    <polygon points="360,500 360,140 400,140 400,500"/>
  </g>

  <!-- Kinetic Speed Lines -->
  <g stroke="#ffd166" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="50" y1="360" x2="160" y2="240"/>
    <line x1="100" y1="320" x2="220" y2="190"/>
    <line x1="140" y1="280" x2="260" y2="140"/>
  </g>

  <!-- Ascending Runner Silhouette -->
  <g fill="#1a0508">
    <circle cx="210" cy="200" r="12"/>
    <polygon points="200,214 222,212 216,255 198,255"/>
    <!-- Front Leg (Stepping Up) -->
    <line x1="214" y1="255" x2="240" y2="270" stroke="#1a0508" stroke-width="8" stroke-linecap="round"/>
    <line x1="240" y1="270" x2="240" y2="290" stroke="#1a0508" stroke-width="7" stroke-linecap="round"/>
    <!-- Back Leg (Pushing Off) -->
    <line x1="202" y1="255" x2="180" y2="290" stroke="#1a0508" stroke-width="8" stroke-linecap="round"/>
    <line x1="180" y1="290" x2="160" y2="340" stroke="#1a0508" stroke-width="7" stroke-linecap="round"/>
    <!-- Arms in Motion -->
    <line x1="205" y1="222" x2="185" y2="240" stroke="#1a0508" stroke-width="6" stroke-linecap="round"/>
    <line x1="185" y1="240" x2="175" y2="260" stroke="#1a0508" stroke-width="5" stroke-linecap="round"/>
    <line x1="215" y1="220" x2="240" y2="230" stroke="#1a0508" stroke-width="6" stroke-linecap="round"/>
    <line x1="240" y1="230" x2="255" y2="220" stroke="#1a0508" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
