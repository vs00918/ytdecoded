<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="summit-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d3b"/>
      <stop offset="50%" stop-color="#2c3e6b"/>
      <stop offset="100%" stop-color="#0c1021"/>
    </linearGradient>
    <radialGradient id="summit-glow" cx="50%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#e76f51" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#151d3b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#summit-sky)"/>
  <circle cx="200" cy="130" r="120" fill="url(#summit-glow)"/>

  <!-- Background Mountain Ridges -->
  <polygon points="50,500 130,220 230,360 350,180 450,500" fill="#1b264f" opacity="0.7"/>

  <!-- Foreground Mountain Peak Pinnacle -->
  <polygon points="0,500 185,140 260,300 400,500" fill="#0d1322"/>
  <!-- Highlighted Ridge Side -->
  <polygon points="185,140 260,300 400,500 240,500" fill="#18233c"/>
  <polygon points="0,500 185,140 240,500" fill="#0d1322"/>

  <!-- Flagpole and Red Flag at Peak (x: 185, y: 140) -->
  <line x1="185" y1="140" x2="185" y2="85" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="185,87 235,100 185,115" fill="#e63946"/>
  <circle cx="185" cy="85" r="2.5" fill="#ffd166"/>
</svg>
