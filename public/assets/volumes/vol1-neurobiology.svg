<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143628"/>
      <stop offset="50%" stop-color="#1e4d3a"/>
      <stop offset="100%" stop-color="#0c231a"/>
    </linearGradient>
    <radialGradient id="bio-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#2d6a4f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0c231a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="500" fill="url(#bio-bg)"/>
  <circle cx="200" cy="250" r="160" fill="url(#bio-glow)"/>
  
  <!-- Neural Soma & Axons -->
  <g stroke="#74c69d" stroke-width="1.5" stroke-linecap="round" opacity="0.6" filter="url(#glow)">
    <line x1="200" y1="250" x2="100" y2="120" stroke-width="2.5"/>
    <line x1="100" y1="120" x2="50" y2="70"/>
    <line x1="100" y1="120" x2="60" y2="150"/>
    <line x1="200" y1="250" x2="310" y2="110" stroke-width="2.5"/>
    <line x1="310" y1="110" x2="360" y2="60"/>
    <line x1="310" y1="110" x2="370" y2="160"/>
    <line x1="200" y1="250" x2="80" y2="330" stroke-width="2"/>
    <line x1="80" y1="330" x2="30" y2="380"/>
    <line x1="80" y1="330" x2="40" y2="290"/>
    <line x1="200" y1="250" x2="320" y2="360" stroke-width="2.5"/>
    <line x1="320" y1="360" x2="370" y2="430"/>
    <line x1="320" y1="360" x2="350" y2="300"/>
    <line x1="200" y1="250" x2="200" y2="420" stroke-width="3"/>
    <line x1="200" y1="420" x2="150" y2="470"/>
    <line x1="200" y1="420" x2="250" y2="470"/>
    <line x1="200" y1="250" x2="200" y2="80" stroke-width="2"/>
    <line x1="200" y1="80" x2="170" y2="30"/>
    <line x1="200" y1="80" x2="230" y2="30"/>
  </g>

  <!-- Secondary Synaptic Mesh -->
  <g stroke="#95d5b2" stroke-width="1" opacity="0.4">
    <line x1="100" y1="120" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="310" y2="110"/>
    <line x1="310" y1="110" x2="320" y2="360"/>
    <line x1="320" y1="360" x2="200" y2="420"/>
    <line x1="200" y1="420" x2="80" y2="330"/>
    <line x1="80" y1="330" x2="100" y2="120"/>
  </g>

  <!-- Synaptic Boutons & Nodes -->
  <g fill="#d8f3dc">
    <circle cx="200" cy="250" r="18" fill="#52b788"/>
    <circle cx="200" cy="250" r="10" fill="#d8f3dc"/>
    <circle cx="100" cy="120" r="5"/>
    <circle cx="310" cy="110" r="6"/>
    <circle cx="80" cy="330" r="5"/>
    <circle cx="320" cy="360" r="6"/>
    <circle cx="200" cy="420" r="7"/>
    <circle cx="200" cy="80" r="5"/>
    <circle cx="50" cy="70" r="3"/>
    <circle cx="360" cy="60" r="3.5"/>
    <circle cx="370" cy="430" r="3.5"/>
    <circle cx="30" cy="380" r="3"/>
    <circle cx="150" cy="470" r="3"/>
    <circle cx="250" cy="470" r="3"/>
  </g>
</svg>
